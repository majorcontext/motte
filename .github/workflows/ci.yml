name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MOTTE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      SEAMS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go run ./internal/lint/cmd/lint ./...
      # testtime prints the test log and fails a test or a package over testdata/test-time-budget.txt.
      - run: |
          set -o pipefail
          go test -race -count=1 -json ./... | go run ./internal/testtime -title Unit -job go
      - run: test -z "$(gofmt -l .)"
      # ./... skips testdata directories, so the privileged harness tools are named.
      - run: go vet ./internal/vfs/testdata/vfsfuzz ./internal/vfs/testdata/overlaycheck ./internal/vfs/testdata/overlaykit
      - run: |
          set -o pipefail
          go test -race -count=1 -json ./internal/vfs/testdata/overlaykit | go run ./internal/testtime -title Overlaykit -job go
      # The overlay and upper directory tests mount file systems and read trusted.* attributes, so they need root.
      - run: |
          set -o pipefail
          sudo -E env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" go test -race -count=1 -json ./internal/vfs/... | go run ./internal/testtime -title 'Privileged vfs' -job vfs
      - run: helm lint charts/motte-vfsd --set apiURL=http://store.example --set image.tag=v0.0.0 --set 'allowedNamespaces={workspaces}'
      - run: |
          helm template motte-vfsd charts/motte-vfsd --set apiURL=http://store.example --set image.tag=v0.0.0 2>&1 | grep -q 'allowedNamespaces is required'
      - run: helm lint charts/motte -f charts/motte/ci/values.yaml
      - run: helm lint charts/motte -f charts/motte/ci/internal-lb.yaml
      - run: helm lint charts/motte -f charts/motte/ci/keys-secret.yaml
      - run: helm template motte charts/motte -f charts/motte/ci/values.yaml > /dev/null
      - run: helm template motte charts/motte -f charts/motte/ci/internal-lb.yaml > /dev/null
      - run: |
          helm template motte charts/motte -f charts/motte/ci/keys-secret.yaml | grep -A4 MOTTE_TRUSTED_KEYS | grep -q secretKeyRef
      - run: |
          ! helm template motte charts/motte -f charts/motte/ci/keys-secret.yaml --set trustedKeysConfigMap.name=x

  leak:
    # A fork pull request gets no secrets, so the job cannot run for it.
    if: github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - run: go run ./internal/leaklint
        env:
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
