name: image

on:
  pull_request:
    paths:
      - go.mod
      - go.sum
      - api/**
      - grant/**
      - volume/**
      - cmd/**
      - internal/**
      - images/motte/**
      - images/motte-vfsd/**
      - .github/workflows/image.yml
      - internal/release/**
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [motte, motte-vfsd]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Build, and on a tag push
        env:
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY || 'ghcr.io' }}
          IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE || github.repository_owner }}
          REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME || github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
        run: |
          args=()
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            args+=(-version "$GITHUB_REF_NAME" -push)
          fi
          go run ./internal/release/cmd/release image \
            -name ${{ matrix.name }} \
            -repo "$IMAGE_REGISTRY/$IMAGE_NAMESPACE/${{ matrix.name }}" \
            "${args[@]}"
