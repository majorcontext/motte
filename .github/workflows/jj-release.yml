name: jj-release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: jj
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            jj/target
          key: cargo-release-${{ matrix.arch }}-${{ hashFiles('jj/Cargo.lock', 'jj/rust-toolchain.toml') }}
      - run: cargo build --release --locked --bin jj
      - name: Attach the binary and its sha256 sum to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p dist
          cp target/release/jj "dist/jj-linux-$ARCH"
          (cd dist && sha256sum "jj-linux-$ARCH" > "jj-linux-$ARCH.sha256")
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "" || gh release view "$TAG" >/dev/null
          gh release upload "$TAG" --clobber "dist/jj-linux-$ARCH" "dist/jj-linux-$ARCH.sha256"
