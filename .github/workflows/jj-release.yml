name: jj-release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Build, check and write the binary and its sha256 sum
        working-directory: .
        run: go run ./internal/release/cmd/release jj -arch ${{ matrix.arch }} -out dist
      - name: Publish
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >
          go run ./internal/release/cmd/release publish -dir dist
          -dest "${{ vars.JJ_RELEASE_DEST || 'github' }}" -tag "$GITHUB_REF_NAME"
