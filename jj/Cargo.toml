[package]
name = "motte-jj"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
publish = false

[lib]
name = "motte_jj"
path = "src/lib.rs"

[[bin]]
name = "jj"
path = "src/main.rs"

[dependencies]
jj-lib = { version = "=0.47.1" }
jj-cli = { version = "=0.47.1", default-features = false, features = ["git"] }
gix = { version = "=0.90.0", default-features = false, features = ["sha1"] }
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
itertools = "0.15"
libc = "0.2"
pollster = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
clru = "0.6"
hex = "0.4"
smallvec = "1"
bstr = "1"
opentelemetry = { version = "=0.33.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "=0.33.1", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }


[dev-dependencies]
rand = "0.9"
rand_chacha = "0.9"

[profile.release]
debug = 1

[lints.clippy]
too_many_lines = "warn"
